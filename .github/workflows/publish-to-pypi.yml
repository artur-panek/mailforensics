name: Publish to PyPI

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Verify release branch matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          branch = os.environ["GITHUB_REF_NAME"]
          expected = f"release/v{version}"
          if branch != expected:
              raise SystemExit(
                  f"release branch {branch!r} does not match package version {expected!r}"
              )
          print(f"release version verified: {version}")
          PY
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate package metadata and README
        run: python -m twine check --strict dist/*
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/mailforensics-release
          /tmp/mailforensics-release/bin/python -m pip install dist/*.whl
          /tmp/mailforensics-release/bin/mailforensics --version
          /tmp/mailforensics-release/bin/mailforensics demo delivered --color never --ascii
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mailforensics
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/v}"
          tag="v${version}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
            exit 0
          fi

          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "MailForensics ${tag}" \
            --generate-notes
