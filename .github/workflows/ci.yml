name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
        if: matrix.python-version == '3.12'
      - run: pytest

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate package metadata and README
        run: python -m twine check --strict dist/*
      - name: Smoke-test built wheel in a clean venv
        shell: bash
        run: |
          python -m venv /tmp/mailforensics-smoke
          /tmp/mailforensics-smoke/bin/python -m pip install dist/*.whl
          /tmp/mailforensics-smoke/bin/mailforensics --version
          /tmp/mailforensics-smoke/bin/mailforensics demo delivered --color never --ascii
