[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mailtrace"
version = "0.4.0"
description = "Trace and explain outbound email flow across applications, Postfix, filters, queues, and relays."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Artur Panek" }]
keywords = ["smtp", "postfix", "rspamd", "email", "observability", "debugging", "cli", "forensics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
mailtrace = "mailtrace.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/mailtrace"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
