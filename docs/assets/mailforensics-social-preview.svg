<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1118"/>
      <stop offset="1" stop-color="#0c141c"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#173044" stroke-width="1" opacity=".45"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="640" fill="#061019" opacity=".18"/>

  <g stroke="#24506a" opacity=".8">
    <path d="M36 0V40M0 40H68M36 600V640M0 600H68M1244 0V40M1210 40H1280M1244 600V640M1210 600H1280" />
  </g>

  <g transform="translate(62 92)">
    <text x="0" y="0" fill="#72c7f5" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="5">CLI TOOL / PYPI</text>
    <line x1="190" y1="-6" x2="282" y2="-6" stroke="#5ab9eb" stroke-width="1"/>

    <text x="0" y="96" fill="#f5f7f9" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">MailForensics</text>

    <text x="0" y="158" fill="#55bdf3" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="650">Trace the evidence,</text>
    <text x="0" y="200" fill="#55bdf3" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="650">not the guess.</text>

    <text x="0" y="256" fill="#aeb9c5" font-family="Consolas, 'Courier New', monospace" font-size="20">Evidence-driven CLI for tracing</text>
    <text x="0" y="286" fill="#aeb9c5" font-family="Consolas, 'Courier New', monospace" font-size="20">outbound email across applications,</text>
    <text x="0" y="316" fill="#aeb9c5" font-family="Consolas, 'Courier New', monospace" font-size="20">Postfix, filters, queues, and relays.</text>

    <rect x="0" y="354" width="440" height="62" rx="8" fill="#0c1822" stroke="#2d6b90"/>
    <text x="18" y="393" fill="#4fc3f7" font-family="Consolas, 'Courier New', monospace" font-size="24">$</text>
    <text x="52" y="393" fill="#f1f4f6" font-family="Consolas, 'Courier New', monospace" font-size="22">pip install mailforensics</text>

    <text x="0" y="476" fill="#7691a4" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="4">OBSERVE   /   TRACE   /   UNDERSTAND</text>
    <line x1="320" y1="470" x2="520" y2="470" stroke="#2d6b90"/>
  </g>

  <g transform="translate(615 28)">
    <rect x="0" y="0" width="602" height="584" rx="12" fill="#090d11" stroke="#476171"/>
    <rect x="0" y="0" width="602" height="34" rx="12" fill="#151d25"/>
    <rect x="0" y="24" width="602" height="10" fill="#151d25"/>
    <circle cx="18" cy="17" r="5" fill="#ff605c"/>
    <circle cx="36" cy="17" r="5" fill="#ffbd44"/>
    <circle cx="54" cy="17" r="5" fill="#00ca4e"/>
    <text x="560" y="21" fill="#6d8fa5" font-family="Consolas, monospace" font-size="9" text-anchor="end" letter-spacing="1.4">MAILFORENSICS</text>

    <g transform="translate(22 52)" font-family="Consolas, 'Courier New', monospace">
      <line x1="0" y1="0" x2="42" y2="0" stroke="#19bfff" stroke-width="2"/>
      <rect x="42" y="-13" width="126" height="26" rx="4" fill="#081117" stroke="#19bfff"/>
      <text x="105" y="5" text-anchor="middle" fill="#53c7ff" font-size="11" letter-spacing="1.5">MAILFORENSICS</text>
      <line x1="168" y1="0" x2="216" y2="0" stroke="#19bfff" stroke-width="2"/>
      <path d="M216 -4l8 4-8 4z" fill="#19bfff"/>
      <text x="64" y="30" fill="#3fc7ff" font-size="11">trace the evidence,</text>
      <text x="64" y="44" fill="#3fc7ff" font-size="11">not the guess.</text>

      <text x="0" y="78" fill="#f1f3f5" font-size="13" font-weight="700">MAILFORENSICS EXPLAIN</text>
      <text x="0" y="94" fill="#d8dde2" font-size="11">query:   correlation=invite-42</text>
      <text x="0" y="109" fill="#d8dde2" font-size="11">status:  deferred</text>

      <text x="0" y="137" fill="#f1f3f5" font-size="12" font-weight="700">Pipeline</text>

      <circle cx="10" cy="154" r="4" fill="#25d13b"/>
      <text x="22" y="158" fill="#f0f2f4" font-size="11">APP</text>
      <text x="108" y="158" fill="#d8dde2" font-size="11">demo-app/invite</text>
      <text x="22" y="173" fill="#d8dde2" font-size="10">│ 92ms</text>
      <text x="22" y="187" fill="#d8dde2" font-size="10">▼</text>

      <circle cx="10" cy="202" r="4" fill="#25d13b"/>
      <text x="22" y="206" fill="#f0f2f4" font-size="11">POSTFIX</text>
      <text x="108" y="206" fill="#d8dde2" font-size="11">postfix/cleanup</text>
      <text x="22" y="221" fill="#d8dde2" font-size="10">│ 34ms</text>
      <text x="22" y="235" fill="#d8dde2" font-size="10">▼</text>

      <circle cx="10" cy="250" r="4" fill="#25d13b"/>
      <text x="22" y="254" fill="#f0f2f4" font-size="11">FILTER</text>
      <text x="108" y="254" fill="#d8dde2" font-size="11">Rspamd: no action</text>
      <text x="22" y="269" fill="#d8dde2" font-size="10">│ 11ms</text>
      <text x="22" y="283" fill="#d8dde2" font-size="10">▼</text>

      <circle cx="10" cy="298" r="4" fill="#25d13b"/>
      <text x="22" y="302" fill="#f0f2f4" font-size="11">QUEUE</text>
      <text x="108" y="302" fill="#d8dde2" font-size="11">queue 0DC461ACD87</text>
      <text x="22" y="317" fill="#d8dde2" font-size="10">│ 842ms</text>
      <text x="22" y="331" fill="#d8dde2" font-size="10">▼</text>

      <circle cx="10" cy="346" r="4" fill="#e8c500"/>
      <text x="22" y="350" fill="#f0f2f4" font-size="11">RELAY</text>
      <text x="108" y="350" fill="#d8dde2" font-size="11">deferred via mx.example.net[203.0.113.10]:25</text>
      <text x="22" y="365" fill="#d8dde2" font-size="10">│ 2.13m</text>
      <text x="22" y="379" fill="#d8dde2" font-size="10">▼</text>

      <circle cx="10" cy="394" r="4" fill="#e8c500"/>
      <text x="22" y="398" fill="#f0f2f4" font-size="11">QUEUE NOW</text>
      <text x="108" y="398" fill="#d8dde2" font-size="11">still present in deferred queue</text>

      <text x="0" y="427" fill="#f1f3f5" font-size="11" font-weight="700">Latency  total observed: 2.15m</text>
      <text x="14" y="443" fill="#d8dde2" font-size="10">demo-app:invite       -&gt; postfix:cleanup          92ms</text>
      <text x="14" y="457" fill="#d8dde2" font-size="10">postfix:cleanup       -&gt; rspamd:filter            34ms</text>
      <text x="14" y="471" fill="#d8dde2" font-size="10">rspamd:filter         -&gt; postfix:qmgr             11ms</text>
      <text x="14" y="485" fill="#d8dde2" font-size="10">postfix:qmgr          -&gt; postfix:smtp            842ms</text>

      <text x="0" y="514" fill="#f1f3f5" font-size="11" font-weight="700">Assessment</text>
      <text x="14" y="530" fill="#d8dde2" font-size="10">outcome:</text>
      <text x="92" y="530" fill="#e8c500" font-size="10">queued-for-retry</text>
      <text x="14" y="544" fill="#d8dde2" font-size="10">confidence: high</text>
    </g>
  </g>
</svg>